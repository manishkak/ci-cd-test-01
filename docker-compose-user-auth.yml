version: '3.8'

services:
  user-auth-backend:
    build:
      context: ./backend/user-auth
      dockerfile: Dockerfile
    container_name: user-auth-backend
    ports:
      - "8000:80"
    volumes:
      - ./backend/user-auth:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - user-auth-network

  user-auth-frontend:
    image: node:18-alpine
    container_name: user-auth-frontend
    working_dir: /app
    volumes:
      - ./frontend/user-auth:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - user-auth-network

networks:
  user-auth-network:
    driver: bridge
